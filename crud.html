<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador Luisa</title>
  <link rel="icon" type="image/png" href="img/Sena_Colombia_logo.svg.png">
  <link rel="stylesheet" href="CSS/crud.css">
  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>

<body class="sb-nav-fixed">
  <input type="checkbox" id="nav-toggle" />
  <div class="main-content">
    <header>
      <h2>RIFA BOYACÁ</h2>
    </header>

    <main>
      <!-- FORMULARIO -->
      <form id="formulario">
        <div class="container-fluid px-3">
          <div class="cards">
            <div class="card-single">
              <div>
                <div class="input-box">
                  <label>Total registros</label>
                  <h2 id="totalRegistros">0</h2>
                </div>
              </div>
            </div>

            <div class="card-single">
              <div>
                <div class="input-box">
                  <label>Números ocupados</label>
                  <h2 id="totalOcupados">0</h2>
                </div>
              </div>
            </div>

            <div class="card-single">
              <div>
                <div class="input-box">
                  <label>Números disponibles</label>
                  <h2 id="totalDisponibles">1000</h2>
                </div>
              </div>
            </div>

            <div class="card-single">
              <div>
                <label>Total dinero</label>
                <h2 id="totalDinero">$0</h2>
              </div>
            </div>
          </div>
        </div>
      </form>

      <!-- TABLA -->
      <div class="recent-grid mt-4">
        <div class="projects">
          <div class="card">
            <div class="card-header">
              <h3>Datos listas</h3>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-bordered">
                  <thead>
                    <tr>
                      <th>Hora</th>
                      <th>FechaRegistro</th>
                      <th>Nombre</th>
                      <th>Apellido</th>
                      <th>Ciudad</th>
                      <th>País</th>
                      <th>Nombre_de_responsable</th>
                      <th>Celular_de_responsable</th>
                      <th>Premio</th>
                      <th>NúmerosSeleccionados</th>
                      <th>Referencia</th>
                      <th>Total</th>
                      <th>Factura</th>
                      <th>Aprobado</th>
                      <th>Eliminar</th>
                    </tr>
                  </thead>
                  <tbody id="tabla-datos"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="gracrud.js"></script>
</body>

</html>
